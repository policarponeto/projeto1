services:
  app:
    build: .
    container_name: projeto1-app
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./php.ini:/usr/local/etc/php/conf.d/custom.ini
    environment:
      - CI_ENVIRONMENT=development
    networks:
      - projeto1-network

networks:
  projeto1-network:
    driver: bridge
